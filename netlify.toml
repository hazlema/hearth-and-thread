# Static deploy: no bundler. Only the game ships; the idea-board exports, tests and tools stay out of the site.
[build]
  command = "rm -rf dist && mkdir -p dist && cp -r index.html src dist/"
  publish = "dist"

# Module workers refuse to start unless .mjs is served as JavaScript.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
